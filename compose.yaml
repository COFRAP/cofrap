services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Créer .env avec scripts/init_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Créer .env avec scripts/init_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-cofrap}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: cofrap_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: cofrap_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofrap_test -d cofrap_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
