apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cofrap-https-redirect
  namespace: cofrap
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cofrap-frontend
  namespace: cofrap
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: cofrap-cofrap-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cofrap.example.com
      secretName: cofrap-tls
  rules:
    - host: cofrap.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cofrap-frontend
                port:
                  number: 8000
