apiVersion: batch/v1
kind: Job
metadata:
  name: cofrap-migrate
  namespace: openfaas-fn
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: cofrap-generate-password
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_HOST
              value: postgres.openfaas-fn.svc
            - name: POSTGRES_PORT
              value: "5432"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: password
              mountPath: /var/openfaas/secrets/cofrap-postgres-password
              subPath: cofrap-postgres-password
              readOnly: true
            - name: encryption
              mountPath: /var/openfaas/secrets/cofrap-encryption-key
              subPath: cofrap-encryption-key
              readOnly: true
      volumes:
        - name: password
          secret:
            secretName: cofrap-postgres-password
        - name: encryption
          secret:
            secretName: cofrap-encryption-key
