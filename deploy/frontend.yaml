apiVersion: apps/v1
kind: Deployment
metadata:
  name: cofrap-frontend
  namespace: openfaas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cofrap-frontend
  template:
    metadata:
      labels:
        app: cofrap-frontend
    spec:
      containers:
        - name: frontend
          image: cofrap-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENFAAS_GATEWAY_URL
              value: http://gateway.openfaas.svc.cluster.local:8080
            - name: PUBLIC_BASE_URL
              value: http://localhost:8000
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cofrap-frontend
  namespace: openfaas
spec:
  selector:
    app: cofrap-frontend
  ports:
    - port: 8000
      targetPort: 8000
