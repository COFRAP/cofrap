apiVersion: apps/v1
kind: Deployment
metadata:
  name: cofrap-frontend
  namespace: cofrap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cofrap-frontend
  template:
    metadata:
      labels:
        app: cofrap-frontend
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cofrap-frontend
      containers:
        - name: frontend
          image: cofrap-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENFAAS_GATEWAY_URL
              value: http://gateway.openfaas.svc:8080
            - name: PUBLIC_BASE_URL
              value: https://cofrap.example.com
            - name: COOKIE_SECURE
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cofrap-frontend
  namespace: cofrap
spec:
  selector:
    app: cofrap-frontend
  ports:
    - port: 8000
      targetPort: 8000
